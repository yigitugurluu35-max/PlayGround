<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>NEON STRIKE</title>
<style>
:root{--cyan:#45eaff;--pink:#ff3d7f;--gold:#ffd166}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b18;font-family:Impact,"Arial Black",sans-serif;color:#fff;touch-action:none;user-select:none}#game{position:relative;width:100%;height:100%;min-height:320px;overflow:hidden;background:linear-gradient(#18214a 0 55%,#2b2541 55% 67%,#17182a 67%)}canvas{display:block;width:100%;height:100%}.ui{position:absolute;inset:0;pointer-events:none}.top{position:absolute;left:3%;right:3%;top:2.2%;height:17%}.names{display:flex;justify-content:space-between;font-size:clamp(12px,1.7vw,24px);letter-spacing:3px;text-shadow:0 2px #000}.portrait-tag{opacity:.85}.healthrow{display:grid;grid-template-columns:1fr 78px 1fr;align-items:center;gap:8px;margin-top:5px}.health{height:clamp(18px,3.2vh,34px);background:#160d22;border:3px solid #aeb1ca;transform:skewX(-12deg);overflow:hidden;box-shadow:0 5px 18px #0009}.health i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff4a62,#ffd166);transition:width .12s}.p2 i{margin-left:auto;background:linear-gradient(90deg,#ffd166,#ff4a62)}.timer{text-align:center;font-size:clamp(26px,5vw,62px);line-height:1;color:#fff;text-shadow:4px 4px 0 #111,-2px -2px 0 #ff3579}.meterrow{display:grid;grid-template-columns:1fr 78px 1fr;gap:8px;margin-top:7px}.meter{height:7px;background:#2a2542;border:1px solid #686680}.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#00d8ff,#fff);box-shadow:0 0 10px #00d8ff}.p2meter i{margin-left:auto;background:linear-gradient(90deg,#fff,#ff5b9a);box-shadow:0 0 10px #ff4f91}.roundbanner{position:absolute;left:50%;top:35%;transform:translate(-50%,-50%);font-size:clamp(38px,9vw,110px);letter-spacing:8px;white-space:nowrap;text-align:center;text-shadow:7px 7px 0 #111,0 0 25px #ff3d7f;opacity:0}.roundbanner.show{animation:banner .9s ease-out}.roundbanner small{display:block;font-family:Arial,sans-serif;font-size:14px;letter-spacing:3px;color:#aeefff}@keyframes banner{0%{opacity:0;transform:translate(-50%,-50%) scale(1.7)}15%,70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0}}.controls{position:absolute;left:2%;bottom:3%;display:flex;align-items:flex-end;gap:10px;pointer-events:auto}.dpad{width:126px;height:126px;position:relative}.btn{position:absolute;width:40px;height:40px;border:2px solid #ffffff55;border-radius:12px;background:#10152bb8;color:#fff;font-size:20px;display:grid;place-items:center;box-shadow:0 4px 12px #0008;-webkit-tap-highlight-color:transparent}.btn:active,.btn.active{background:#45eaff55;transform:scale(.92)}#left{left:0;bottom:43px}#right{left:86px;bottom:43px}#up{left:43px;top:0}#down{left:43px;bottom:0}.actions{position:absolute;right:2%;bottom:3%;display:flex;align-items:flex-end;gap:8px;pointer-events:auto}.action{width:62px;height:62px;border-radius:50%;border:3px solid #fff8;font-size:12px;letter-spacing:1px;text-align:center;background:#d52d66cc;box-shadow:0 5px 18px #0009}.action:nth-child(2){background:#e8a52dcc}.action:nth-child(3){background:#2caed5cc}.action.special-ready{box-shadow:0 0 18px #fff,0 0 28px #45eaff}.help{position:absolute;right:2%;top:20%;width:190px;text-align:right;font-family:Arial,sans-serif;font-size:11px;line-height:1.7;color:#d8dcf5;text-shadow:1px 1px #000}.help b{color:#ffd166}.pause{position:absolute;right:2%;top:2.2%;width:38px;height:38px;border-radius:50%;border:2px solid #fff7;background:#15182bb8;font-size:16px;color:#fff;pointer-events:auto}.overlay{position:absolute;inset:0;background:#090c20c9;display:none;place-items:center;pointer-events:auto}.overlay.show{display:grid}.card{text-align:center;border:2px solid #777ba2;background:#17192ed9;padding:28px 42px;box-shadow:12px 12px 0 #050714}.card h1{font-size:clamp(38px,8vw,78px);margin:0 0 12px;text-shadow:5px 5px #ff3d7f}.card button{font-family:Impact,sans-serif;font-size:20px;letter-spacing:2px;padding:12px 28px;border:0;background:#ff3d7f;color:white;box-shadow:5px 5px #9c1d49}@media(pointer:fine){.controls,.actions{opacity:.38}.controls:hover,.actions:hover{opacity:1}}@media(max-height:500px){.help{display:none}.dpad{transform:scale(.78);transform-origin:left bottom}.actions{gap:4px}.action{width:54px;height:54px}.top{top:1%}.names{font-size:16px}}@media(max-width:700px){.help{display:none}.controls{left:1%;bottom:2%}.actions{right:1%;bottom:2%}.dpad{transform:scale(.82);transform-origin:left bottom}.action{width:52px;height:52px}.healthrow,.meterrow{grid-template-columns:1fr 42px 1fr}.top{left:2%;right:2%}}
</style>
</head>
<body><div id="game"><canvas id="c"></canvas><div class="ui"><div class="top"><div class="names"><span><b>KAI</b> <small>STRIKER</small></span><span class="portrait-tag"><small>SHADOW</small> <b>RYU-KO</b></span></div><div class="healthrow"><div class="health"><i id="hp1"></i></div><div class="timer" id="timer">60</div><div class="health p2"><i id="hp2"></i></div></div><div class="meterrow"><div class="meter"><i id="m1"></i></div><div></div><div class="meter p2meter"><i id="m2"></i></div></div></div><div class="roundbanner" id="banner">FIGHT!<small>ROUND 1</small></div><div class="help"><b>A / D</b> MOVE<br><b>W</b> JUMP<br><b>J</b> PUNCH<br><b>K</b> KICK<br><b>↓ A J</b> NOVA COMET<br><b>↓ D K</b> CYAN DASH<br><b>S J</b> OVERDRIVE</div><button class="pause" id="pause">Ⅱ</button><div class="controls"><div class="dpad"><button class="btn" id="left" data-key="KeyA">◀</button><button class="btn" id="right" data-key="KeyD">▶</button><button class="btn" id="up" data-key="KeyW">▲</button><button class="btn" id="down" data-key="KeyS">▼</button></div></div><div class="actions"><button class="action" id="punch" data-key="KeyJ">PUNCH</button><button class="action" id="kick" data-key="KeyK">KICK</button><button class="action" id="special" data-key="special">SPECIAL</button></div><div class="overlay" id="overlay"><div class="card"><h1 id="result">YOU WIN</h1><button id="again">REMATCH</button></div></div></div></div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');let W,H,ground,scale,last=0,paused=false,ended=false,time=60,round=1;
function resize(){const r=canvas.getBoundingClientRect();W=r.width;H=r.height;canvas.width=W*devicePixelRatio;canvas.height=H*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);ground=H*.79;scale=Math.max(.65,Math.min(1.25,W/1100));}addEventListener('resize',resize);resize();
const keys={};addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code))e.preventDefault();keys[e.code]=true;if(e.code==='KeyP')togglePause();});addEventListener('keyup',e=>keys[e.code]=false);
const fighter=(x,c,enemy)=>({x,y:ground,vx:0,vy:0,w:76,h:150,face:1,hp:100,meter:35,enemy,c,crouch:false,jump:false,attack:null,atkT:0,hurt:0,dead:false,block:false});
let p1=fighter(W*.28,'#00c9ed'),p2=fighter(W*.72,'#ff3d75');
function resetPositions(){p1.x=W*.28;p2.x=W*.72;p1.y=p2.y=ground;p1.hp=p2.hp=100;p1.meter=p2.meter=35;p1.dead=p2.dead=false;p1.attack=p2.attack=null;p1.hurt=p2.hurt=0;p1.vx=p2.vx=0;time=60;document.getElementById('overlay').classList.remove('show');ended=false;banner('FIGHT!',`ROUND ${round}`)}
resetPositions();
function banner(a,b){const el=document.getElementById('banner');el.innerHTML=a+(b?`<small>${b}</small>`:'');el.classList.remove('show');void el.offsetWidth;el.classList.add('show')}
let particles=[],projectiles=[],shake=0;
function addPart(x,y,c,n=12){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-0.5)*7,vy:(Math.random()-0.7)*7,life:1,c})}
function hit(a,b,damage,knock=5){if(b.hurt>0||b.dead)return;const blocked=b.block&&b.x>a.x&&a.face<0||b.block&&b.x<a.x&&a.face>0;damage=blocked?damage*.25:damage;b.hp=Math.max(0,b.hp-damage);b.hurt=blocked?9:18;b.vx=(a.x<b.x?1:-1)*knock*(blocked?.35:1);b.vy=-2.5*(damage>12?1:0);a.meter=Math.min(100,a.meter+damage*.8);b.meter=Math.min(100,b.meter+damage*.45);addPart(b.x,b.y-b.h* .55,b.c,blocked?5:14);shake=blocked?3:7;if(b.hp<=0)b.dead=true}
function attack(f,type){if(f.attack||f.hurt||f.dead)return;if(type==='punch'||type==='kick'){f.attack=type;f.atkT=12;f.meter=Math.min(100,f.meter+2)}if(type==='nova'){if(f.meter<35)return;f.meter-=35;f.attack='nova';f.atkT=30;projectiles.push({x:f.x+(f.face*55),y:f.y-95,vx:f.face*10,life:70,c:'#ff9a33',r:24,owner:f})}if(type==='dash'){if(f.meter<25)return;f.meter-=25;f.attack='dash';f.atkT=24;f.vx=f.face*13}if(type==='over'){if(f.meter<100)return;f.meter=0;f.attack='over';f.atkT=45;setTimeout(()=>{if(!ended){f.attack='overhit';shake=12;addPart(f.enemy.x,f.enemy.y-90,'#fff',30);hit(f,f.enemy,24,12)}},180)}}
function rectHit(a,b,w=60){return a.x+a.face*w> b.x-b.w/2&&a.x+a.face*w<b.x+b.w/2&&Math.abs(a.y-b.y)<100}
function updateF(f){f.face=f.enemy.x<f.x?-1:1;f.block=false;if(f.hurt>0){f.hurt--;f.vx*=.82}else if(f.attack){f.atkT--;if(f.attack==='punch'&&f.atkT===8&&rectHit(f,f.enemy,62))hit(f,f.enemy,7,3);if(f.attack==='kick'&&f.atkT===8&&rectHit(f,f.enemy,78))hit(f,f.enemy,10,5);if(f.attack==='nova'||f.attack==='dash'||f.attack==='over'){ }if(f.atkT<=0)f.attack=null}else{f.vx*=.82}f.vy+=.72;f.y+=f.vy;if(f.y>ground){f.y=ground;f.vy=0;f.jump=false}f.x+=f.vx;f.x=Math.max(50,Math.min(W-50,f.x));if(!f.attack&&f.hurt===0&&f.enemy&&Math.abs(f.enemy.x-f.x)<80){const push=(f.enemy.x<f.x?-1:1)*.6;f.x+=push}}
function playerInput(){p1.crouch=false;if(paused||ended)return;if(keys.KeyA){p1.vx-=.9;p1.block=!p1.attack&&p1.face===1}if(keys.KeyD){p1.vx+=.9;p1.block=!p1.attack&&p1.face===-1}if(keys.KeyS)p1.crouch=true;if((keys.KeyW||keys.ArrowUp)&&p1.y>=ground&&!p1.jump){p1.vy=-15;p1.jump=true}if(keys.KeyJ&&!playerInput.jLock){playerInput.jLock=true;const downward=keys.KeyS||keys.ArrowDown;if(downward)attack(p1,'nova');else attack(p1,'punch')}if(!keys.KeyJ)playerInput.jLock=false;if(keys.KeyK&&!playerInput.kLock){playerInput.kLock=true;if(keys.KeyS||keys.ArrowDown)attack(p1,'dash');else attack(p1,'kick')}if(!keys.KeyK)playerInput.kLock=false;if(keys.KeyL)attack(p1,'over')}
let aiT=0;function cpu(){if(paused||ended)return;aiT--;p2.crouch=false;if(aiT<=0){aiT=18+Math.random()*28;const d=p2.x-p1.x;if(Math.abs(d)>150){p2.vx+=d>0?-1.3:1.3;if(p2.meter>=25&&Math.random()<.16)attack(p2,'dash')}else{if(Math.random()<.25)p2.block=true;else if(p2.meter>=35&&Math.random()<.18)attack(p2,'nova');else if(p2.meter>=100&&Math.random()<.12)attack(p2,'over');else attack(p2,Math.random()<.55?'punch':'kick')}}if(p1.x-p2.x>360)p2.vx-=1}
function drawSky(){let g=ctx.createLinearGradient(0,0,0,H*.68);g.addColorStop(0,'#11183a');g.addColorStop(.7,'#3c315d');g.addColorStop(1,'#dc607c');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#ffb47a55';ctx.beginPath();ctx.arc(W*.72,H*.22,Math.min(W,H)*.13,0,7);ctx.fill();ctx.fillStyle='#13142e';for(let i=0;i<7;i++){const x=i*W/6-W*.05,h=H*(.12+((i*37)%40)/300);ctx.fillRect(x,H*.58-h,W/6+4,h)}ctx.fillStyle='#262640';ctx.fillRect(0,H*.58,W,H*.09);ctx.fillStyle='#5d4967';ctx.fillRect(0,H*.67,W,H*.12);ctx.fillStyle='#181827';ctx.fillRect(0,H*.79,W,H*.21);ctx.fillStyle='#34304a';for(let i=0;i<12;i++)ctx.fillRect(i*W/11,H*.79,2,H*.21);ctx.fillStyle='#df9d5d22';ctx.fillRect(0,ground+30,W,3)}
function drawF(f){ctx.save();ctx.translate(f.x,f.y);ctx.scale(f.face,1);ctx.globalAlpha=f.hurt%3? .65:1;if(f.dead)ctx.rotate(-1.35);const s=scale*.9;ctx.scale(s,s);ctx.translate(0,-150);const c=f.c;if(f.attack==='over'||f.attack==='overhit'){ctx.globalAlpha=.3;ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(0,95,75,145,0,0,7);ctx.fill();ctx.globalAlpha=1}ctx.fillStyle='#171827';ctx.fillRect(-34,65,26,82);ctx.fillRect(10,65,26,82);ctx.fillStyle=c;ctx.fillRect(-38,137,32,12);ctx.fillRect(8,137,34,12);ctx.fillStyle='#20243a';ctx.beginPath();ctx.moveTo(-38,35);ctx.lineTo(38,35);ctx.lineTo(30,78);ctx.lineTo(-32,78);ctx.closePath();ctx.fill();ctx.fillStyle=c;ctx.fillRect(-30,29,60,48);ctx.fillStyle='#0e1020';ctx.fillRect(-35,55,70,12);ctx.fillStyle='#d8a17d';ctx.beginPath();ctx.arc(0,15,29,0,7);ctx.fill();ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(-30,-5);ctx.lineTo(-8,-18);ctx.lineTo(12,-14);ctx.lineTo(31,-2);ctx.lineTo(22,15);ctx.lineTo(-27,12);ctx.closePath();ctx.fill();ctx.fillStyle='#111';ctx.fillRect(7,13,16,5);ctx.fillStyle='#d8a17d';if(f.attack==='punch'||f.attack==='kick'||f.attack==='dash'||f.attack==='nova'||f.attack==='over'){ctx.save();ctx.rotate(f.attack==='kick'?-.5:-.8);ctx.fillRect(28,38,65,18);ctx.beginPath();ctx.arc(95,47,15,0,7);ctx.fill();ctx.restore()}else{ctx.fillRect(28,42,20,18);ctx.beginPath();ctx.arc(48,51,15,0,7);ctx.fill()}ctx.fillStyle='#d8a17d';ctx.fillRect(-45,42,18,18);ctx.restore();}
function draw(){drawSky();for(const pr of particles){ctx.globalAlpha=pr.life;ctx.fillStyle=pr.c;ctx.fillRect(pr.x,pr.y,4,4)}ctx.globalAlpha=1;for(const q of projectiles){ctx.save();ctx.translate(q.x,q.y);ctx.rotate(q.life*.12);ctx.fillStyle='#ffb43a';ctx.beginPath();ctx.arc(0,0,q.r,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-q.r*.2,0,q.r*.55,0,7);ctx.fill();ctx.restore()}drawF(p1);drawF(p2);}
function loop(t){let dt=Math.min(32,t-last);last=t;if(!paused&&!ended){playerInput();cpu();updateF(p1);updateF(p2);for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.25;p.life-=.03;if(p.life<=0)particles.splice(i,1)}for(let i=projectiles.length-1;i>=0;i--){let q=projectiles[i];q.x+=q.vx;q.life--;if(Math.abs(q.x-q.owner.enemy.x)<55&&Math.abs(q.y-(q.owner.enemy.y-95))<90){hit(q.owner,q.owner.enemy,14,7);q.life=0}if(q.life<=0||q.x<-100||q.x>W+100)projectiles.splice(i,1)}if(p1.dead||p2.dead){ended=true;setTimeout(()=>finish(p2.dead?'YOU WIN':'DEFEAT'),500)}time-=dt/1000;if(time<=0){time=0;ended=true;finish(p1.hp>=p2.hp?'DRAW':'DEFEAT')}}ctx.save();if(shake>0){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.75}draw();ctx.restore();document.getElementById('hp1').style.width=p1.hp+'%';document.getElementById('hp2').style.width=p2.hp+'%';document.getElementById('m1').style.width=p1.meter+'%';document.getElementById('m2').style.width=p2.meter+'%';document.getElementById('timer').textContent=Math.ceil(time);document.querySelectorAll('.btn').forEach(b=>b.classList.toggle('active',keys[b.dataset.key]));document.getElementById('special').classList.toggle('special-ready',p1.meter>=25);requestAnimationFrame(loop)}
function finish(r){document.getElementById('result').textContent=r;document.getElementById('overlay').classList.add('show')}
function togglePause(){paused=!paused;document.getElementById('pause').textContent=paused?'▶':'Ⅱ';if(paused)banner('PAUSED','') ;else banner('FIGHT!','')}
document.getElementById('pause').onclick=togglePause;document.getElementById('again').onclick=()=>{round++;resetPositions()};
document.querySelectorAll('[data-key]').forEach(b=>{const code=b.dataset.key;if(code==='special')return;const set=(v)=>keys[code]=v;b.addEventListener('pointerdown',e=>{e.preventDefault();set(true);b.setPointerCapture(e.pointerId)});b.addEventListener('pointerup',()=>set(false));b.addEventListener('pointercancel',()=>set(false))});
function specialAction(){if(keys.KeyS||p1.crouch)attack(p1,p1.meter>=25?'dash':'nova');else if(p1.meter>=100)attack(p1,'over');else attack(p1,'nova')}
document.getElementById('punch').addEventListener('pointerdown',e=>{e.preventDefault();attack(p1,'punch')});document.getElementById('kick').addEventListener('pointerdown',e=>{e.preventDefault();attack(p1,'kick')});document.getElementById('special').addEventListener('pointerdown',e=>{e.preventDefault();specialAction()});
p1.enemy=p2;p2.enemy=p1;requestAnimationFrame(loop);
</script></body></html>
